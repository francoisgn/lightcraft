# FORK-ONLY (francoisgn/lightcraft): never part of an upstream PR. See CLAUDE.local.md.
#
# On-demand personal build: Actions ▸ "Fork build" ▸ Run workflow, pick a ref and a platform.
# Reuses the upstream packaging scripts, unsigned (macOS: ad-hoc signature, so right-click ▸ Open
# the first time). Artifacts are downloadable from the run page for 14 days. No release is drafted.
name: Fork build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (e.g. main, a feature branch, upstream SHA)"
        type: string
        default: main
      platform:
        description: "What to build"
        type: choice
        default: macos-aarch64
        options: [macos-aarch64, linux-x86_64, windows-x64, all]

permissions:
  contents: read

concurrency:
  group: fork-build-${{ inputs.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CRAFT_FONTS_REF: 3d9ab3a132ed0eff457e424226a435a901da30d3 # same pin as release.yml

jobs:
  macos:
    if: github.repository == 'francoisgn/lightcraft' && (inputs.platform == 'macos-aarch64' || inputs.platform == 'all')
    timeout-minutes: 90
    runs-on: macos-15 # standard Apple Silicon runner (release.yml's macos-15-xlarge is a paid runner)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-macos-aarch64
      - name: Build and package (ad-hoc signed)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-macos-aarch64
          path: dist/release/*
          retention-days: 14
          if-no-files-found: error

  linux:
    if: github.repository == 'francoisgn/lightcraft' && (inputs.platform == 'linux-x86_64' || inputs.platform == 'all')
    timeout-minutes: 90
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-linux-x86_64
      - name: Build (tar.gz of the two binaries; no AppImage/deb/rpm)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          cargo build --release --locked -p lightcraft -p lightcraft-cli --features lightcraft/heif,lightcraft-cli/heif
          mkdir -p dist
          tar -czf dist/lightcraft-linux-x86_64.tar.gz -C target/release lightcraft lightcraft-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-linux-x86_64
          path: dist/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  windows:
    if: github.repository == 'francoisgn/lightcraft' && (inputs.platform == 'windows-x64' || inputs.platform == 'all')
    timeout-minutes: 90
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-windows-x64
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and package (unsigned MSI + portable zip)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-windows-x64
          path: dist/release/*
          retention-days: 14
          if-no-files-found: error
